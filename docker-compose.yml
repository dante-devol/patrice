# Patrice — dev/evaluation stack.
# `docker compose up --build` on an empty DB: migrations run, the worker prints a
# bootstrap key and opens Gateway sessions, and the web app is served on :8080.
#
# Secrets / overrides: create a .env file in this directory (docker-compose reads
# it automatically). Relevant vars:
#   SESSION_SECRET, TOKEN_PEPPER  — override the throwaway dev defaults
#   INTEGRATION_TOKEN_KEY         — required: 64 hex chars (`openssl rand -hex 32`).
#                                   Only the worker gets it.
#
# ⚠️  NOT a production deployment. Plain HTTP on localhost; throwaway secrets.
#     For production you MUST at minimum:
#       - terminate TLS and set COOKIE_SECURE=true
#       - supply strong, unique SESSION_SECRET and TOKEN_PEPPER (≥32 random bytes)
#       - use the S3 storage driver (local-fs is single-instance only)

x-api-base: &api-base
  build:
    context: ./api
  depends_on:
    db:
      condition: service_healthy

x-common-env: &common-env
  DATABASE_URL: postgresql://patrice:patrice@db:5432/patrice?schema=public
  PUBLIC_BASE_URL: http://localhost:8080
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-please}
  TOKEN_PEPPER: ${TOKEN_PEPPER:-dev-token-pepper-change-me-please}
  # Throwaway dev key — override via root .env for any persistent data.
  SECRETS_KEY: ${SECRETS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  SMTP_URL: smtp://mailpit:1025
  EMAIL_FROM: Patrice <no-reply@patrice.local>
  NODE_ENV: development
  LOG_LEVEL: info
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: 'true'

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: patrice
      POSTGRES_PASSWORD: patrice
      POSTGRES_DB: patrice
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 images store data in a version-specific subdirectory, so the
      # mount goes at /var/lib/postgresql (NOT /var/lib/postgresql/data).
      - patrice-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patrice']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP
    restart: unless-stopped

  # HTTP-only role: handles all inbound API requests. No background jobs.
  api:
    <<: *api-base
    environment:
      <<: *common-env
      PROCESS_ROLE: api
      PORT: '3000'
    ports:
      - '3000:3000'

  # Worker role: pg-boss consumers, cron, GC, Discord Gateway sessions, bootstrap
  # mode. The only service with the bot-token key; never exposes HTTP.
  worker:
    <<: *api-base
    environment:
      <<: *common-env
      PROCESS_ROLE: worker
      LOG_LEVEL: debug
      INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY:?Set INTEGRATION_TOKEN_KEY in .env (openssl rand -hex 32)}

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  patrice-db:
